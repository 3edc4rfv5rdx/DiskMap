# Everything that differs between projects. The numbered steps and 98-common
# name nothing else — copy the whole folder into a project, edit this file, and
# the set works.

# The name the release APKs carry. Lowercase, no spaces: it goes into file names
# and must match the prefix Gradle renames the APKs to (see
# ADD/gradle-version-wiring.kts).
PROJECT="diskmap"

# The Gradle module the APKs come out of.
APP_MODULE="app"

# The emulator to install on. adb devices calls it this.
EMULATOR_SERIAL="emulator-5554"

# Where a brand-new build_number.txt starts. Only ever read once, when the file
# is not there yet.
INITIAL_BASE_VERSION="0.1"

# The launcher-icon master and the script that cuts it up, for 02-MakeIcons.sh.
# Leave ICON_MASTER empty in a project that draws its icons by hand.
ICON_MASTER=""
ICON_SCRIPT="tools/make_icon.py"
# The generated files, by name, looked for under $APP_MODULE/src/main/res.
ICON_OUTPUTS="ic_launcher_foreground.png"
# The blue the launcher plate is painted in — the same one in every project here.
# 02-MakeIcons.sh puts it in the environment as ICON_BG_COLOR for the icon
# script; the Android side reads it from res/values/colors.xml, where
# ic_launcher_background must be set to the same value.
ICON_BG_COLOR="#013895"

# The ABIs a release is built for, in the order 19-LinkOut.sh links them into
# OUT/. x86_64 is left out on purpose: it only ever goes to the emulator.
#LINK_ABIS="arm64-v8a universal"
LINK_ABIS="arm64-v8a"

# Where 21-PushTag.sh pushes: the branch the work is on, and the remote it goes
# to. Named rather than read off HEAD, so a push from a branch that is not the
# one releases come from stops instead of going out.
GIT_BRANCH="main"
GIT_REMOTE="origin"
